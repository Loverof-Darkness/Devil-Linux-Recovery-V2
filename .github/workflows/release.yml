name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python
        run: |
          python -m compileall -q devil
          python -m unittest discover -s tests -q

      - name: Validate shell launcher
        run: bash -n launcher/devil.sh

      - name: Build release archive
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=devil-linux-recovery-v2/ HEAD > dist/devil-linux-recovery-v2.tar.gz
          sha256sum dist/devil-linux-recovery-v2.tar.gz > dist/checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/devil-linux-recovery-v2.tar.gz
            dist/checksums.txt
