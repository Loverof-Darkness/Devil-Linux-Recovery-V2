[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devil-linux-recovery-v2"
version = "0.2.0"
description = "Universal Linux boot recovery platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-only" }
authors = [{ name = "Loverof-Darkness" }]
dependencies = []

[project.scripts]
devil = "devil.cli:main"

[tool.setuptools.packages.find]
include = ["devil*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
